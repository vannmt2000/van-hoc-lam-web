<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Công ty TNHH Một Con Sen</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="login-container">
        <span class="login-paw login-paw-left">🐾</span>
        <span class="login-paw login-paw-right">🐾</span>
        <h2>Đăng Nhập</h2>
        <p class="subtitle">
    <span class="subtitle-text">Chào mừng bạn đến với Hội Con Sen</span>
    <span class="subtitle-emoji">🐱</span>
    <span class="subtitle-float subtitle-float-1">✨</span>
    <span class="subtitle-float subtitle-float-2">🐾</span>
    <span class="subtitle-float subtitle-float-3">💖</span>
</p>

        <form id="email-login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nhap@ots.com" required>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
            </div>
            <button type="submit" class="email-btn" id="submit-btn">Đăng Nhập</button>
            <p id="message" class="message"></p>
        </form>

        <p class="switch-auth">
            <a href="#" id="forgot-password-link">Quên mật khẩu?</a>
        </p>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
