<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - OTS ERP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>🔐 Đăng Nhập</h2>
        <p class="subtitle">Chào mừng bạn đến với OTS ERP</p>

        <form id="email-login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nhap@ots.com" required>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
            </div>
            <button type="submit" class="email-btn" id="submit-btn">Đăng Nhập</button>
            <p id="message" class="message"></p>
        </form>

        <p class="switch-auth">
            <a href="#" id="forgot-password-link">Quên mật khẩu?</a>
        </p>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
