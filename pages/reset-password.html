<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Vân Học Làm Web</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>🔐 Đặt Lại Mật Khẩu</h2>
        <p class="subtitle">Nhập mật khẩu mới của bạn</p>

        <form id="reset-form">
            <div class="input-group">
                <label for="new-password">Mật khẩu mới</label>
                <input type="password" id="new-password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
            </div>
            <div class="input-group">
                <label for="confirm-password">Nhập lại mật khẩu mới</label>
                <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu" required minlength="6">
            </div>
            <button type="submit" class="email-btn" id="submit-btn">Đặt Lại Mật Khẩu</button>
            <p id="message" class="message"></p>
        </form>

        <p class="switch-auth">
            <a href="login.html">← Quay lại đăng nhập</a>
        </p>
    </div>

    <script src="../assets/js/reset-password.js"></script>
</body>
</html>
